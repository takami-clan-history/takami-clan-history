          <p><font size="4"><b><font face="ＭＳ Ｐ明朝, 細明朝体">古荘嘉門</font></b><font face="ＭＳ Ｐ明朝, 細明朝体"> 
            ふるしょう-かもん1840‐1915 明治時代の官僚,政治家。 </font></font></p>
          <p><font size="4"><font face="ＭＳ Ｐ明朝, 細明朝体">天保(てんぽう)11年12月1日生まれ。明治11年大阪上等裁判所判事。</font></font></p>
          <p><font size="4"><font face="ＭＳ Ｐ明朝, 細明朝体">のち郷里熊本へかえり,14年紫溟(しめい)会を組織し,民権論に対抗して国権主義をとなえた。</font></font></p>
          <p><font size="4"><font face="ＭＳ Ｐ明朝, 細明朝体">23年熊本国権党総理となり衆議院議員(当選5回)。群馬県,三重県の知事をつとめ,38年貴族院議員。大正4年5月11日死去。76歳。号は火海。 
            </font> </font> </p>
