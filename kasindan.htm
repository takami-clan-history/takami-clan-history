<p align="center"><b><font size="6" face="ＭＳ Ｐ明朝, 細明朝体">細川家臣団</font></b></p>
<center>
  <table width="640" border="0">
    <tr> 
      <td height="153"> 
        <p><font size="4" face="ＭＳ Ｐ明朝, 細明朝体">細川家の家臣団は、知行取約1000家、切米・扶持米取3000～4000家と 
          云われる。その根本家臣は「青龍寺以来」「丹後以来」と称する家である。 </font></p>
        <p><font size="4" face="ＭＳ Ｐ明朝, 細明朝体">ある資料によると、「青龍寺以来」は27氏・59家、「丹後以来」は74氏・126 
          家とされている。</font></p>
        <p><font size="4" face="ＭＳ Ｐ明朝, 細明朝体">細川藤孝が信長から「城州之内限る桂川西地」の支配権を認められたのは元亀4年7月10日であるが、勝龍寺城はその地域に属す。</font></p>
        <p><font size="4" face="ＭＳ Ｐ明朝, 細明朝体"><a href="tangoirai.htm">丹後以来之面々子孫</a></font></p>
      </td>
  </tr>
