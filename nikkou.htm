  <p><b><font face="ＭＳ Ｐ明朝, 細明朝体" size="6">日光御宮御霊屋</font></b></p>

        <blockquote> 
          <div class="Section1" style="layout-grid:16.55pt -.8pt;mso-layout-grid-char-alt:

              <div class="Section1" style="layout-grid:19.15pt 1.05pt;mso-layout-grid-char-alt:
4232"> 
                <div align="left"> 
                  <p><font size="4" face="ＭＳ Ｐ明朝, 細明朝体">徳川家康を祀る日光東照宮で、遺言として「遺体は駿河の久能山に葬り、一周忌を過ぎたら下野（しもつけ栃木県）の日光山に小堂を建てて勧請せよ」という内容のもので、二代の徳川秀忠が日光東照宮を創建、三代の徳川家光は1634年から1年5ヶ月の工期、延べ168万人の大工と金56万8000両、銀100貫匁、米1,000石の巨額を投じて完成させた。</font></p>
                  <p><font size="4" face="ＭＳ Ｐ明朝, 細明朝体">家康は東照大権現として奥宮に霊廟が祀られた（寛永の大造替）。 
                    東照宮の修復は定期的に行われているが、文政2年（1819年）にも大々的に修復作業が行われた。</font></p>
