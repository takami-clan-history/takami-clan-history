        <p align="center"><font size="3" face="ＭＳ Ｐ明朝, 細明朝体">肥後國於飽田玉名山鹿山本</font></p>
        <p align="center"><font size="3" face="ＭＳ Ｐ明朝, 細明朝体">四郡之内所之都合八百弐拾壱石</font></p>
        <p align="center"><font size="3" face="ＭＳ Ｐ明朝, 細明朝体">四斗餘目録在別紙事任先規之旨</font></p>
        <p align="center"><font size="3" face="ＭＳ Ｐ明朝, 細明朝体">所宛行之訖全可領知之状如件</font></p>
        <p align="center"><font size="3" face="ＭＳ Ｐ明朝, 細明朝体">寛文元年八月五日綱利（花押）</font></p>
        <p align="center"><font size="3" face="ＭＳ Ｐ明朝, 細明朝体">高見権之助殿</font></p>
      </td>
      <td height="40"> 
        <p align="center"><font size="3" face="ＭＳ Ｐ明朝, 細明朝体">肥後の国飽田、玉名、山鹿、山本</font></p>
        <p align="center"><font size="3" face="ＭＳ Ｐ明朝, 細明朝体">四郡のうちこの所都合八百弐拾壱石四斗余り</font></p>
        <p align="center"><font size="3" face="ＭＳ Ｐ明朝, 細明朝体">&lt;目録別紙にあり&gt;のこと先規の旨に任せ</font></p>
        <p align="center"><font size="3" face="ＭＳ Ｐ明朝, 細明朝体">これを宛がいおわんところ全く領知すべき</font></p>
        <p align="center"><font size="3" face="ＭＳ Ｐ明朝, 細明朝体">の状くだんの如し</font></p>
        <p align="center"><font size="3" face="ＭＳ Ｐ明朝, 細明朝体">寛文元年八月五日綱利（花押）</font></p>
