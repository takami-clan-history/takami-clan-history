        <p><font size="4" face="ＭＳ Ｐ明朝, 細明朝体">津不良、津布良とも記す。現在は大垣市津村町。大垣輪中の東部に位置し、東を揖斐川が南流する。西は上開発村。</font></p>
        <p><font size="4" face="ＭＳ Ｐ明朝, 細明朝体">慶長６年（１６０１年）９月の辻忠兵衛合戦覚（黄薇古簡集）によれば、「津府良村ニ而夜打之事」が小早川秀明秋の家中稲葉内匠に伝えられている。
