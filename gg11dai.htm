        <p><font size="4"><b><font face="ＭＳ Ｐ明朝, 細明朝体">熊之助</font></b><font face="ＭＳ Ｐ明朝, 細明朝体">　母右同断　天保九年九月十七日出生　後嶋之助<font size="-1">与</font>改</font></font></p>
        <blockquote>
          <p><font size="4" face="ＭＳ Ｐ明朝, 細明朝体">文久元年四月二十三日家督父権右衛門<font size="-1">二</font><font color="#FF0000">■■</font>御知行九百五拾石家屋敷共<font size="-1">ニ</font>被下置</font></p>
          <p><font size="4" face="ＭＳ Ｐ明朝, 細明朝体">此着座<font size="-1">被</font>　仰付小笠原備前殿組<font size="-1">ニ被</font>差加小笠原一学増座<font size="-1">被</font>　仰付</font></p>
          <p><font size="4" face="ＭＳ Ｐ明朝, 細明朝体">妻　長岡治部之丞姉　離縁　後妻　松岡甚九郎娘　和喜後貞操院</font><font size="4" face="ＭＳ Ｐ明朝, 細明朝体">与改</font></p>
